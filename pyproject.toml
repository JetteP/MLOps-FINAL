[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tcga_mlops_assignment"
version = "0.1.0"
description = "Multi-modal TCGA Cancer Classification for AMC Pathologists"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "h5py",
    "matplotlib",
    "seaborn",
    "pandas",
    "torch",
    "torchvision",
    "torcheval",
    "scikit-learn",   
    "vllm",            
    "umap-learn",       
    "tqdm",
    "pyyaml",           
    "python-dotenv",
    "ruff",             
]

[tool.ruff]
exclude = [".git", "__pycache__", "venv", "build"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- PACKAGE DISCOVERY ---
# Voorkomt dat data-mappen als Python-pakketten worden gezien
[tool.setuptools.packages.find]
where = ["."]
exclude = ["tcga_data*", "vllm*", "scripts*", "tests*", "data*"]