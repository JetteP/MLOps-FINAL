name: MLOps Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Lint Check
        run: |
          pip install ruff==0.1.14
          ruff check .
          # Dit zorgt dat de 'lint' stap alleen slaagt als alles perfect geformatteerd is
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # We installeren direct via pyproject.toml (editable install)
          pip install -e .
          pip install pytest
      - name: Run Unit Tests
        run: pytest tests/